[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "free_energy_landscape"
version = "2.0.1"
description = "Builds the free energy landscape of a molecular dynamics simulation from two collective variables, segments it into metastable states by watershed, and reports a representative frame for each one."
readme = "README.md"
authors = [{ name = "Leon Sulfierry", email = "sulfierry@gmail.com" }]
license = {text = "LGPL-3.0-only"}
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
    ]
keywords = [
    "free energy landscape",
    "molecular dynamics",
    "collective variables",
    "Boltzmann inversion",
    "kernel density estimation",
    "metastable states",
    "watershed",
    "conformational clustering",
]
# Pisos escolhidos como as primeiras versoes com suporte a Python 3.12+, para que uma
# instalacao limpa num interpretador recente nunca tente compilar uma roda antiga.
dependencies = [
    "numpy>=1.26",
    "imageio>=2.34",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "joblib>=1.3",
]
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
packages = ["free_energy_landscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/sulfierry/free_energy_landscape"
Repository = "https://github.com/sulfierry/free_energy_landscape"
Documentation = "https://github.com/sulfierry/free_energy_landscape/blob/main/docs/METHOD.md"
Changelog = "https://github.com/sulfierry/free_energy_landscape/blob/main/CHANGELOG.md"
Issues = "https://github.com/sulfierry/free_energy_landscape/issues"


[project.scripts]
free_energy_landscape = "free_energy_landscape.freeEnergyLandscape:main"
