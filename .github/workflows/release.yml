name: release

# Publishes to PyPI through Trusted Publishing: PyPI authenticates this workflow
# directly via OIDC, so there is no API token to create, store or leak.
#
# The trusted publisher registered on PyPI must match this file exactly:
#   owner sulfierry / repo free_energy_landscape / workflow release.yml / environment pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Refuse to publish a version the tag does not agree with
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME declares $tag, pyproject.toml declares $version"
            exit 1
          fi
          echo "tag and pyproject.toml both say $version"

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: |
          pip install .[test]
          pytest -q

      - name: Build
        run: python -m build

      - name: Check the artefacts render on PyPI
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing; nothing else is needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
